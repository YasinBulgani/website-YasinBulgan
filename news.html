<section class="py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-4xl font-bold text-gray-900 text-center mb-12" data-lang="tr">Haber Akışı</h2>
        <h2 class="text-4xl font-bold text-gray-900 text-center mb-12 hidden" data-lang="en">News Feed</h2>
        <div class="space-y-8" id="news-feed">
            <!-- News items populated by JavaScript -->
        </div>
    </div>
</section>
<script>
    // Add news feed script
    const newsFeed = [
        { title: "Selenium 4.0 Yenilikleri", titleEn: "Selenium 4.0 Updates", content: "Selenium'un yeni sürümü test otomasyonunda çığır açıyor.", contentEn: "Selenium's new version revolutionizes test automation.", date: "01 Mayıs 2025" },
        { title: "Cypress ile Performans", titleEn: "Performance with Cypress", content: "Cypress'in hız odaklı yeni özellikleri tanıtıldı.", contentEn: "Cypress introduces speed-focused new features.", date: "28 Nisan 2025" },
        { title: "API Test Otomasyonu", titleEn: "API Test Automation", content: "Postman ile API testlerini otomatikleştirme rehberi.", contentEn: "Guide to automating API tests with Postman.", date: "25 Nisan 2025" },
    ];
    const newsContainer = document.getElementById("news-feed");
    newsFeed.forEach(news => {
        const newsItem = document.createElement("div");
        newsItem.className = "card p-6 hover:shadow-lg transition-shadow";
        newsItem.innerHTML = `
            <h3 class="text-xl font-semibold text-blue-600 mb-2" data-lang="tr">${news.title}</h3>
            <h3 class="text-xl font-semibold text-blue-600 mb-2 hidden" data-lang="en">${news.titleEn}</h3>
            <p class="text-gray-600" data-lang="tr">${news.content}</p>
            <p class="text-gray-600 hidden" data-lang="en">${news.contentEn}</p>
            <p class="text-sm text-gray-500 mt-2">${news.date}</p>
        `;
        newsContainer.appendChild(newsItem);
    });
</script>
